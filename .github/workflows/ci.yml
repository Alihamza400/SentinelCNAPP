name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Lint Go
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Lint Frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/go
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run Go Tests
        run: go test ./... -v -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build All Go Services
        run: go build ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gitleaks secrets scanner
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push asset-inventory
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/asset-inventory/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/asset-inventory:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scanner-iac
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/scanner-iac/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/scanner-iac:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push correlation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/correlation/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/correlation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scanner-iac
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/scanner-iac/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/scanner-iac:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scanner-container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/scanner-container/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/scanner-container:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scanner-k8s
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/scanner-k8s/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/scanner-k8s:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scanner-secrets
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/scanner-secrets/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/scanner-secrets:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push risk-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/risk-engine/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/risk-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push attack-path
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/attack-path/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/attack-path:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/runtime/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/runtime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push remediation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/remediation/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/remediation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ai-assistant
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai-assistant/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ai-assistant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
