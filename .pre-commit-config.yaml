repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.58.0
    hooks:
      - id: golangci-lint
        args: ['--timeout=5m']

  - repo: https://github.com/BenGallard/trivy-pre-commit
    rev: v0.6.0
    hooks:
      - id: trivyfs-docker
        args: ['--severity', 'CRITICAL,HIGH', '--exit-code', '1']

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test ./... -count=1
        language: system
        pass_filenames: false
        stages: [push]

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        pass_filenames: false
