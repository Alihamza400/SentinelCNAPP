apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-risk-engine
spec:
  replicas: {{ .Values.riskEngine.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: risk-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/component: risk-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: risk-engine
          image: "{{ .Values.riskEngine.image.repository }}:{{ .Values.riskEngine.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SENTINEL_SERVICE_NAME
              value: "sentinel-risk-engine"
            - name: SENTINEL_SERVICE_PORT
              value: "8080"
            - name: SENTINEL_NEO4J_URI
              value: "bolt://{{ .Release.Name }}-neo4j:7687"
            - name: SENTINEL_NEO4J_USER
              value: "neo4j"
            - name: SENTINEL_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel-cnapp.fullname" . }}-neo4j
                  key: password
            - name: SENTINEL_LOG_LEVEL
              value: "{{ .Values.riskEngine.config.sentinelLogLevel }}"
          resources: {{ toYaml .Values.riskEngine.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-risk-engine
spec:
  selector:
    app.kubernetes.io/component: risk-engine
  ports:
    - port: 8080
      targetPort: http
      name: http
