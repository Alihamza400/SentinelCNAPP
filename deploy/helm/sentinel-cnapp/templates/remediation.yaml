apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-remediation
spec:
  replicas: {{ .Values.remediation.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: remediation
  template:
    metadata:
      labels:
        app.kubernetes.io/component: remediation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "sentinel-cnapp.fullname" . }}-remediation
      containers:
        - name: remediation
          image: "{{ .Values.remediation.image.repository }}:{{ .Values.remediation.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SENTINEL_SERVICE_NAME
              value: "sentinel-remediation"
            - name: SENTINEL_SERVICE_PORT
              value: "8080"
            - name: SENTINEL_NEO4J_URI
              value: "bolt://{{ .Release.Name }}-neo4j:7687"
            - name: SENTINEL_NEO4J_USER
              value: "neo4j"
            - name: SENTINEL_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel-cnapp.fullname" . }}-neo4j
                  key: password
            - name: SENTINEL_NATS_URL
              value: "nats://{{ .Release.Name }}-nats:4222"
            - name: SENTINEL_LOG_LEVEL
              value: "{{ .Values.remediation.config.sentinelLogLevel }}"
            - name: AWS_REGION
              value: "{{ .Values.remediation.config.awsRegion }}"
          resources: {{ toYaml .Values.remediation.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-remediation
spec:
  selector:
    app.kubernetes.io/component: remediation
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-remediation
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.remediation.iamRoleARN }}"
