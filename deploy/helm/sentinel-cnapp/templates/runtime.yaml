apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-runtime
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/component: runtime
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: runtime
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SENTINEL_SERVICE_NAME
              value: "sentinel-runtime"
            - name: SENTINEL_SERVICE_PORT
              value: "8080"
            - name: SENTINEL_NATS_URL
              value: "nats://{{ .Release.Name }}-nats:4222"
            - name: SENTINEL_LOG_LEVEL
              value: "{{ .Values.runtime.config.sentinelLogLevel }}"
          resources: {{ toYaml .Values.runtime.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-runtime
spec:
  selector:
    app.kubernetes.io/component: runtime
  ports:
    - port: 8080
      targetPort: http
      name: http
