# Dex OIDC Configuration
# https://dexidp.io/docs/configuration/

issuer: http://dex:5556/dex

storage:
  type: kubernetes
  config:
    inCluster: true

web:
  http: 0.0.0.0:5556

grpc:
  addr: 0.0.0.0:5557

telemetry:
  http: 0.0.0.0:5558

oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false

staticClients:
  - id: sentinel-cnapp
    name: SentinelCNAPP
    secretEnv: DEX_CLIENT_SECRET
    redirectURIs:
      - http://localhost:3000/auth/callback
      - https://dashboard.sentinel-cnapp.io/auth/callback

connectors:
  - type: local
    id: local
    name: Local
    config:
      # Users are defined in staticPasswords below
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $DEX_GITHUB_CLIENT_ID
      clientSecret: $DEX_GITHUB_CLIENT_SECRET
      redirectURI: http://dex:5556/dex/callback

# Default static users for development
staticPasswords:
  - email: admin@sentinel-cnapp.io
    hash: $2a$10$2b2cU8CPhOTaGgw1n5xG9u5F2rF5qF5qF5qF5qF5qF5qF5qF5qF5q
    username: admin
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
    roles:
      - admin
  - email: viewer@sentinel-cnapp.io
    hash: $2a$10$2b2cU8CPhOTaGgw1n5xG9u5F2rF5qF5qF5qF5qF5qF5qF5qF5qF5q
    username: viewer
    userID: "18a8684b-db88-4b73-90a9-3cd1661f5466"
    roles:
      - viewer

# Enable password DB for development
enablePasswordDB: true
