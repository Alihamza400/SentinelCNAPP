# Envoy Gateway Configuration
# https://www.envoyproxy.io/docs/envoy/latest/

static_resources:
  listeners:
    - name: public_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_specifier:
                  resource_only: ""
                route_config_name: local_route
                http_filters:
                  # External auth (OIDC validation)
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      grpc_service:
                        envoy_grpc:
                          cluster_name: ext_authz
                        timeout: 0.5s
                      transport_api_version: V3

                  # CORS
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # Router
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  routes:
    - name: local_route
      virtual_hosts:
        - name: backend
          domains: ["*"]
          cors:
            allow_origin_string_match:
              - prefix: "*"
            allow_methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
            allow_headers: content-type, authorization, x-request-id
            max_age: "86400"
          routes:
            # Asset Inventory API
            - match:
                prefix: /api/v1/assets
              route:
                cluster: asset-inventory
                timeout: 30s
              typed_per_filter_config:
                envoy.filters.http.ext_authz:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                  check_settings:
                    context_extensions:
                      resource: /assets

            # Correlation: findings + dashboard + graph
            - match:
                prefix: /api/v1/findings
              route:
                cluster: correlation
                timeout: 30s
            - match:
                prefix: /api/v1/dashboard
              route:
                cluster: correlation
                timeout: 30s
            - match:
                prefix: /api/v1/graph
              route:
                cluster: correlation
                timeout: 30s

            # Attack path analysis
            - match:
                prefix: /api/v1/attack-paths
              route:
                cluster: attack-path
                timeout: 30s

            # Risk engine
            - match:
                prefix: /api/v1/risk
              route:
                cluster: risk-engine
                timeout: 30s

            # Remediation workflow
            - match:
                prefix: /api/v1/remediation
              route:
                cluster: remediation
                timeout: 30s

            # AI assistant
            - match:
                prefix: /api/v1/ai
              route:
                cluster: ai-assistant
                timeout: 30s

            # Runtime protection
            - match:
                prefix: /api/v1/runtime
              route:
                cluster: runtime
                timeout: 30s

            # Scanner fan-out (dev-gateway selects via X-Scanner header)
            - match:
                prefix: /api/v1/scan
              route:
                cluster: scanner-iac
                timeout: 120s
            - match:
                prefix: /webhook
              route:
                cluster: scanner-iac
                timeout: 30s

            # Health check (no auth)
            - match:
                prefix: /health
              route:
                cluster: asset-inventory
                timeout: 5s
              typed_per_filter_config:
                envoy.filters.http.ext_authz:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                  disabled: true

            # Metrics (no auth)
            - match:
                prefix: /metrics
              route:
                cluster: asset-inventory
                timeout: 5s
              typed_per_filter_config:
                envoy.filters.http.ext_authz:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                  disabled: true

  clusters:
    - name: asset-inventory
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: asset-inventory
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: asset-inventory
                      port_value: 8080

    - name: correlation
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: correlation
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: correlation
                      port_value: 8080
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_retries: 3

    - name: attack-path
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: attack-path
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: attack-path
                      port_value: 8080

    - name: risk-engine
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: risk-engine
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: risk-engine
                      port_value: 8080

    - name: remediation
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: remediation
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: remediation
                      port_value: 8080

    - name: ai-assistant
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ai-assistant
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ai-assistant
                      port_value: 8080

    - name: runtime
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: runtime
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: runtime
                      port_value: 8080

    - name: scanner-iac
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: scanner-iac
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: scanner-iac
                      port_value: 8080

    - name: ext_authz
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ext-authz
                      port_value: 9001

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

layered_runtime:
  layers:
    - name: static_layer
      layer:
        "[@type]": type.googleapis.com/envoy.config.runtime.v3.RuntimeLayer
        static_layer:
          re2.max_program_size.error_level: 100000
