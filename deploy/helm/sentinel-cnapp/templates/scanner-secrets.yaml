apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-scanner-secrets
spec:
  replicas: {{ .Values.scannerSecrets.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: scanner-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scanner-secrets
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: scanner-secrets
          image: "{{ .Values.scannerSecrets.image.repository }}:{{ .Values.scannerSecrets.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SENTINEL_SERVICE_NAME
              value: "sentinel-scanner-secrets"
            - name: SENTINEL_SERVICE_PORT
              value: "8080"
            - name: SENTINEL_NATS_URL
              value: "nats://{{ .Release.Name }}-nats:4222"
            - name: SENTINEL_LOG_LEVEL
              value: "{{ .Values.scannerSecrets.config.sentinelLogLevel }}"
            - name: SENTINEL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel-cnapp.fullname" . }}-webhook
                  key: secret
          resources: {{ toYaml .Values.scannerSecrets.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel-cnapp.fullname" . }}-scanner-secrets
spec:
  selector:
    app.kubernetes.io/component: scanner-secrets
  ports:
    - port: 8080
      targetPort: http
      name: http
