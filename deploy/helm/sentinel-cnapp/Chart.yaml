apiVersion: v2
name: sentinel-cnapp
description: SentinelCNAPP - Unified Cloud-Native Application Protection Platform
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: postgresql
    version: ~15.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  - name: redis
    version: ~19.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

  - name: neo4j
    version: ~5.0
    repository: https://helm.neo4j.com/neo4j
    condition: neo4j.enabled

  - name: nats
    version: ~1.0
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
